<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Astro Bunny: Turbo Run</title>
  <!-- Fuentes Arcade y Sci-Fi Racing -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@1,600;1,700;1,900&family=Orbitron:ital,wght@1,700;1,800;1,900&family=Russo+One&display=swap" rel="stylesheet">
  <!-- SDK Universal de Playgama Bridge (gestiona YouTube Playables, Telegram y Web) -->
  <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010206;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #070914 0%, #010206 100%);
    }
    #game-wrapper {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
      background: #02040c;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game-wrapper">
      <canvas id="game-canvas"></canvas>
    </div>
  </div>
  <script type="module" src="./main.js?v=1795466785797"></script>
</body>
</html>
